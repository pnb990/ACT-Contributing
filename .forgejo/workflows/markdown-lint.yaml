---

# Thin caller: the steps live once in soft-lib/ci, this file holds what is
# specific to this project -- the trigger and the image pin. The rules are
# .markdownlint.yaml at the root, the same file the editor extension and the
# dev container read.
#
# It replaces markdown_lint.yml, which ran on `ubuntu-latest` -- a runner this
# forge does not have -- and only linted the root `*.md`, leaving software/
# and every coding standard outside the lint.

"on":
  # `push`, like lint-reuse.yaml. The two gate the same way, for the same
  # reason.
  push:

jobs:
  markdown-lint:
    # Pinned to a commit: a change in soft-lib/ci breaks nothing here until
    # this line is bumped, which is a reviewable commit and a git revert away.
    uses: soft-lib/ci/.forgejo/workflows/markdown-lint.yaml@5b27fc3dd09c2c1dd70cf66337c992d2b7a61d6f
    with:
      # The same image as lint-reuse.yaml, pinned to the same commit, so there
      # is one pin to bump rather than two.
      image: pnb990/python3:ci-20260824-f0906ec6f4f6c7af652b6012e93af76b0c1eea6e
